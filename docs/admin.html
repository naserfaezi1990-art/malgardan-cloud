<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="فیش‌بان">
<meta property="og:title" content="فیش‌بان">
<meta property="og:description" content="مدیریت هوشمند واریزی و تسویه">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="فیش‌بان">
<meta name="twitter:description" content="مدیریت هوشمند واریزی و تسویه">
<meta name="theme-color" content="#0F2A24">
<meta property="og:image" content="https://naserfaezi1990-art.github.io/malgardan-cloud/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://naserfaezi1990-art.github.io/malgardan-cloud/og.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>اتاق فرمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#0f1115; --panel:#181b22; --panel-2:#20242e; --line:#2b303c; --gold:#d4af6a; --ink:#e8e6e1; --dim:#8b93a3; --ok:#4caf6a; --warn:#e05a4e; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Vazirmatn',sans-serif; background:var(--bg); color:var(--ink); padding:24px; }
.wrap { max-width:1240px; margin:0 auto; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
h1 { font-size:20px; margin:0; font-weight:700; }
.tabs { display:flex; gap:8px; background:var(--panel); padding:4px; border-radius:10px; }
.tabs button { background:none; border:none; color:var(--dim); padding:8px 16px; border-radius:8px; font-family:inherit; font-size:13px; cursor:pointer; }
.tabs button.active { background:var(--gold); color:#1a1408; font-weight:600; }
.hero { background:linear-gradient(135deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:20px; }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:12px; }
.hero-label { color:var(--dim); font-size:13px; line-height:1.9; }
.hero-label b { color:var(--ink); font-weight:700; }
.hero-pct { font-size:36px; font-weight:800; color:var(--gold); line-height:1; }
.hero-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.hero-stat { display:flex; flex-direction:column; gap:3px; min-width:0; }
.hero-stat span { color:var(--dim); font-size:11.5px; }
.hero-stat b { font-size:15px; font-weight:700; direction:ltr; text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
@media (max-width:560px) { .hero-stats { grid-template-columns:1fr; gap:8px; } .hero-stat { flex-direction:row; justify-content:space-between; align-items:baseline; } }
.hero-bar { height:14px; background:#2b303c; border-radius:8px; overflow:hidden; }
.hero-bar-fill { height:100%; background:linear-gradient(90deg,#d4af6a,#f0d28f); border-radius:8px; }
.section-title { font-size:14px; color:var(--dim); margin:28px 0 12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
.card.idle { border-color:var(--warn); }
.card.selected { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
.card-top { display:flex; justify-content:space-between; align-items:start; margin-bottom:10px; }
.card-title { font-size:14px; font-weight:600; }
.card-client { font-size:11px; color:var(--dim); }
.badge { font-size:10px; padding:2px 8px; border-radius:20px; background:#2b303c; color:var(--dim); white-space:nowrap; }
.badge.idle { background:rgba(224,90,78,.15); color:var(--warn); }
.progress-row { display:flex; align-items:center; gap:10px; margin:10px 0 6px; }
.progress { flex:1; height:8px; background:#2b303c; border-radius:6px; overflow:hidden; }
.progress-bar { height:100%; background:var(--gold); border-radius:6px; }
.progress-pct { font-size:12px; font-weight:700; color:var(--gold); min-width:34px; text-align:left; direction:ltr; }
/* سقف/واریزی/مانده هر کدوم یه ردیفِ جدا با برچسب سمت راست و عدد سمت چپ -- عددهای ۱۲ رقمی کنار هم جا نمی‌شدن و به هم می‌چسبیدن */
.card-stats { display:flex; flex-direction:column; font-size:12px; color:var(--dim); }
.stat-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0; border-top:1px solid var(--line); }
.stat-row:first-child { border-top:none; }
.stat-row span { white-space:nowrap; }
.stat-row b { color:var(--ink); font-size:13.5px; font-weight:700; direction:ltr; font-variant-numeric:tabular-nums; }
.stat-row.remain b { color:var(--gold); }
.stat-row.over b, .stat-row.over span { color:var(--warn); }
.progress-bar.over { background:var(--warn); }
.progress-pct.over { color:var(--warn); }
.hero-stat.over span, .hero-stat.over b { color:var(--warn); }
.hero-stat.ok b { color:var(--ok); }
.hero-stat.remain b { color:var(--warn); }
.empty { text-align:center; color:var(--dim); padding:60px 0; }
.updated { text-align:center; font-size:11px; color:var(--dim); margin-top:24px; }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; font-size:13px; }
th,td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); }
th { color:var(--dim); font-weight:600; font-size:12px; }
tr:last-child td { border-bottom:none; }
.status { padding:2px 8px; border-radius:20px; font-size:11px; }
.status.confirmed { background:rgba(76,175,106,.15); color:var(--ok); }
.status.returned { background:rgba(224,90,78,.15); color:var(--warn); }
/* ---- کارت حساب (طراحی نو) ---- */
.grid { grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.acard { --accent:var(--gold); position:relative; display:flex; flex-direction:column; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; overflow:hidden; transition:transform .15s ease,border-color .15s ease; }
.acard::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--accent); }
.acard:hover { transform:translateY(-2px); border-color:#3a4050; }
.acard.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.acard.t-ok, .acard.t-full { --accent:var(--ok); }
.acard.t-over { --accent:var(--warn); }
.acard-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:2px; }
.route { display:flex; align-items:center; gap:8px; min-width:0; font-weight:700; font-size:15px; }
.route span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.route .dst { color:var(--gold); }
.route svg { flex:none; color:var(--dim); }
.pill { flex:none; font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:99px; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
.owner { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--dim); min-width:0; }
.owner svg { flex:none; opacity:.7; } .owner span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.amain { display:flex; align-items:center; gap:16px; padding:4px 2px 0; }
.ring { position:relative; flex:none; width:72px; height:72px; }
.ring svg { display:block; } .ring circle { fill:none; stroke-width:7; }
.ring .track { stroke:#2b303c; } .ring .bar { stroke:var(--accent); stroke-linecap:round; }
.ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:14px; font-weight:800; color:var(--accent); direction:ltr; }
.ahero { display:flex; flex-direction:column; gap:3px; min-width:0; flex:1; }
.ahero small { font-size:12px; color:var(--dim); }
.aval { display:flex; align-items:baseline; gap:6px; white-space:nowrap; direction:rtl; }
.aval b { font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; direction:ltr; }
.aval em { font-style:normal; font-size:12px; color:var(--dim); }
.aval.remain b { color:var(--warn); } .aval.done b { color:var(--ok); } .aval.over b { color:var(--warn); }
.atoman { font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.afacts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.afacts > div { display:flex; flex-direction:column; gap:2px; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:9px 11px; min-width:0; }
.afacts small { font-size:11.5px; color:var(--dim); }
.afacts b { font-size:13.5px; font-weight:800; font-variant-numeric:tabular-nums; direction:ltr; text-align:right; white-space:nowrap; }
.afacts .ok b { color:var(--ok); }
.afacts span { font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
.ameta { display:flex; flex-wrap:wrap; gap:6px; }
.ameta .badge { font-size:11px; padding:3px 10px; }
.tot { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>اتاق فرمان فیش‌بان</h1>
<div class="tabs">
<button id="btnToday" class="active">امروز</button>
<button id="btnYesterday">دیروز</button>
</div>
</div>
<div id="app"><div class="empty">در حال بارگذاری...</div></div>
</div>
<script>
const API = 'https://malgardan-cloud.naserfaezi1990.workers.dev';
const token = new URLSearchParams(location.search).get('token') || '';
function money(n){ return Number(n||0).toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function gregorianToJalali(gy, gm, gd){
const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
let gy2 = (gm > 2) ? (gy + 1) : gy;
let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
let jy = -1595 + (33 * Math.floor(days / 12053));
days %= 12053;
jy += 4 * Math.floor(days / 1461);
days %= 1461;
if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
let jm, jd;
if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
return jy + '/' + String(jm).padStart(2,'0') + '/' + String(jd).padStart(2,'0');
}
function jalaliDateFor(offsetDays){
const d = new Date(Date.now() + offsetDays*86400000);
return gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
}
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toAsciiDigits(v){ return String(v==null?'':v).replace(/[۰-۹]/g, function(d){ return String(FA_DIGITS.indexOf(d)); }); }
function idleHours(lastReceiptAt){
if(!lastReceiptAt) return null;
const iso = lastReceiptAt.replace(' ','T') + 'Z';
const diffMs = Date.now() - new Date(iso).getTime();
return Math.max(0, Math.floor(diffMs/3600000));
}
function toPersianDigits(v){ return String(v==null?'':v).replace(/[0-9]/g, function(d){ return FA_DIGITS[Number(d)]; }); }
// درصدِ تکمیلِ یه حساب: همیشه از خودِ واریزی/سقف حساب می‌شه (نه درصدِ ذخیره‌شده) تا نوار، عدد کارت و
// عددِ بالای صفحه همیشه دقیقاً یکی باشن. حساب بی‌سقف درصد نداره (null).
function pctOf(a){
const t = Number(a.target_amount||0);
if(!(t>0)) return null;
return Math.min(100, Math.round(Number(a.confirmed_total||0)*100/t));
}
function remainOf(a){ return Math.max(0, Number(a.target_amount||0) - Number(a.confirmed_total||0)); }
// واریزی از سقف رد شده؟ «مانده: ۰» غلط بود؛ مقدار اضافه‌واریز نشون داده می‌شه (فقط برای حساب سقف‌دار)
function overOf(a){ return Number(a.target_amount||0)>0 ? Math.max(0, Number(a.confirmed_total||0) - Number(a.target_amount||0)) : 0; }
async function fetchAdmin(date){
let url = API + '/admin?token=' + encodeURIComponent(token);
if(date) url += '&date=' + encodeURIComponent(date);
const res = await fetch(url);
const data = await res.json();
return { ok: res.ok, data: data };
}
async function load(date){
const app = document.getElementById('app');
currentDate = date;
selectedAccountId = null;
if(!token){ app.innerHTML = '<div class="empty">دسترسی نامعتبر است.</div>'; return; }
app.innerHTML = '<div class="empty">در حال بارگذاری...</div>';
try {
// فیش‌هایی که تاریخشون قدیم‌تر با رقم فارسی ذخیره شده («۱۴۰۵/۰۶/۲۸») با تاریخِ انگلیسی مطابقت نمی‌کنن و
// سرور فقط برابریِ عینی چک می‌کنه؛ پس هر دو شکل رو می‌گیریم و با هم ادغام می‌کنیم تا هیچ فیشی جا نیفته.
const main = await fetchAdmin(date);
if(!main.ok){ app.innerHTML = '<div class="empty">' + esc(main.data.error||'خطا') + '</div>'; return; }
const data = main.data;
if(date){
try {
const legacy = await fetchAdmin(toPersianDigits(date));
if(legacy.ok && Array.isArray(legacy.data.receipts)){
const seen = {};
(data.receipts||[]).forEach(function(r){ seen[r.sync_uuid||('id'+r.receipt_id)] = true; });
legacy.data.receipts.forEach(function(r){ const k = r.sync_uuid||('id'+r.receipt_id); if(!seen[k]){ seen[k] = true; data.receipts.push(r); } });
}
} catch(e) { /* فقط یه پشتیبانِ اضافه بود؛ نبودنش مهم نیست */ }
}
render(data);
} catch(e) {
app.innerHTML = '<div class="empty">ارتباط برقرار نشد.</div>';
}
}
let selectedAccountId = null;
let lastData = null;
let currentDate = null;
function render(data){
lastData = data;
const app = document.getElementById('app');
// data.accounts کل عمر حسابه‌ست؛ اینجا فقط حساب‌های متعلق به همین روز (valid_jalali) رو
// نگه می‌داریم تا اتاق فرمان دقیقاً همون چیزی رو نشون بده که تو خود فیش‌بان برای این روز ثبت شده.
const allAccounts = (data.accounts||[]);
const accounts = allAccounts.filter(function(a){ return toAsciiDigits(a.valid_jalali)===currentDate; })
  .sort(function(a,b){ const pa = pctOf(a), pb = pctOf(b); return (pa==null?101:pa)-(pb==null?101:pb); });
const todayConfirmedByAccount = {}, todayCountByAccount = {};
(data.receipts||[]).forEach(function(r){
if(r.status==='confirmed'){
todayConfirmedByAccount[r.account_id] = (todayConfirmedByAccount[r.account_id]||0) + Number(r.amount||0);
todayCountByAccount[r.account_id] = (todayCountByAccount[r.account_id]||0) + 1;
}
});
const limited = accounts.filter(function(a){ return Number(a.target_amount||0) > 0; });
// وقتی روی یه کارت کلیک شده، بالای صفحه درصدِ همون حساب رو نشون می‌ده (نه درصدِ کلِ همه‌ی حساب‌ها)
const selected = selectedAccountId ? accounts.find(function(a){ return a.id===selectedAccountId; }) : null;
if(selectedAccountId && !selected) selectedAccountId = null;
let heroLabel, heroPct, heroTarget, heroConfirmed, heroRemain, heroRemainLabel = 'مانده تا سقف', heroOver = false;
if(selected){
const hasT = Number(selected.target_amount||0) > 0;
heroLabel = 'درصد تکمیل حساب <b>' + esc(selected.source_party_name||'—') + ' ← ' + esc(selected.destination_party_name||'—') + '</b>';
heroPct = hasT ? pctOf(selected) : null;
heroTarget = hasT ? money(selected.target_amount) : 'ندارد';
heroConfirmed = money(selected.confirmed_total);
heroOver = overOf(selected) > 0;
heroRemainLabel = heroOver ? 'اضافه‌واریز' : 'مانده تا سقف';
heroRemain = hasT ? money(heroOver ? overOf(selected) : remainOf(selected)) : '—';
} else {
const totalTarget = limited.reduce(function(s,a){ return s+Number(a.target_amount||0); },0);
const totalConfirmed = limited.reduce(function(s,a){ return s+Number(a.confirmed_total||0); },0);
const totalRemain = limited.reduce(function(s,a){ return s+remainOf(a); },0);
heroLabel = 'درصد تکمیل کل حساب‌های سقف‌دار<br><span style="font-size:11.5px">برای دیدنِ درصدِ یک حساب، روی کارتش کلیک کن</span>';
heroPct = totalTarget>0 ? Math.min(100, Math.round(totalConfirmed*100/totalTarget)) : 0;
heroTarget = money(totalTarget); heroConfirmed = money(totalConfirmed); heroRemain = money(totalRemain);
}
const heroBarWidth = heroPct==null ? 0 : heroPct;
let html = '<div class="hero"><div class="hero-top"><span class="hero-label">' + heroLabel + '</span><span class="hero-pct">' + (heroPct==null ? '—' : heroPct + '%') + '</span></div><div class="hero-bar"><div class="hero-bar-fill" style="width:' + heroBarWidth + '%"></div></div>';
html += '<div class="hero-stats"><div class="hero-stat"><span>سقف حساب</span><b>' + heroTarget + '</b></div><div class="hero-stat ok"><span>واریزی تا این لحظه</span><b>' + heroConfirmed + '</b></div><div class="hero-stat remain' + (heroOver?' over':'') + '"><span>' + heroRemainLabel + '</span><b>' + heroRemain + '</b></div></div></div>';
if(!accounts.length){
html += '<div class="empty">برای این روز حسابی ثبت نشده است.</div>';
} else {
html += '<div class="grid">';
for(const a of accounts){
const hasTarget = Number(a.target_amount||0) > 0;
const pct = hasTarget ? pctOf(a) : null;
const idle = idleHours(a.last_receipt_at);
const isIdle = idle!=null && idle>=3;
const over = overOf(a) > 0;
const remain = remainOf(a);
const tone = over ? 'over' : (hasTarget && remain===0 ? 'full' : 'warn');
const stateText = over ? 'اضافه‌واریز' : (a.status==='closed' || (hasTarget && remain===0) ? 'تکمیل' : 'فعال');
const src = a.source_party_name ? esc(a.source_party_name) : '—';
const dst = a.destination_party_name ? esc(a.destination_party_name) : '—';
const receiptCount = todayCountByAccount[a.id]||0;
const isSelected = selectedAccountId===a.id;
const C = 169.65, off = hasTarget ? (C*(1-Math.min(100,pct)/100)).toFixed(2) : C;
const ring = hasTarget ? '<div class="ring"><svg viewBox="0 0 64 64" width="72" height="72"><circle class="track" cx="32" cy="32" r="27"/><circle class="bar" cx="32" cy="32" r="27" stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '" transform="rotate(-90 32 32)"/></svg><b>' + pct + '%</b></div>' : '';
const heroLabel = over ? 'اضافه‌واریز' : (hasTarget ? 'مانده تا سقف' : 'واریزی تا این لحظه');
const heroVal = over ? overOf(a) : (hasTarget ? remain : Number(a.confirmed_total||0));
const heroCls = over ? 'over' : (hasTarget ? (remain===0 ? 'done' : 'remain') : 'done');
const owner = esc(a.owner_name||'—') + (a.bank_name && String(a.owner_name||'').indexOf(a.bank_name)<0 ? ' <span style="opacity:.8">· ' + esc(a.bank_name) + '</span>' : '');
html += '<div class="acard t-' + tone + (isSelected?' selected':'') + '" data-account-id="' + a.id + '" title="برای دیدن فقط فیش‌های این حساب کلیک کن">';
html += '<div class="acard-top"><div class="route"><span>' + src + '</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="dst">' + dst + '</span></div><span class="pill">' + stateText + '</span></div>';
html += '<div class="owner"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>' + owner + '</span></div>';
html += '<div class="amain">' + ring + '<div class="ahero"><small>' + heroLabel + '</small><div class="aval ' + heroCls + '"><b>' + money(heroVal) + '</b><em>ریال</em></div><span class="atoman">' + money(Math.floor(heroVal/10)) + ' تومان</span></div></div>';
html += '<div class="afacts"><div><small>سقف حساب</small><b>' + (hasTarget ? money(a.target_amount) : 'ندارد') + '</b><span>' + (hasTarget ? money(Math.floor(Number(a.target_amount)/10)) + ' تومان' : '—') + '</span></div>';
html += '<div class="ok"><small>واریزی تا این لحظه</small><b>' + money(a.confirmed_total) + '</b><span>' + money(Math.floor(Number(a.confirmed_total||0)/10)) + ' تومان</span></div></div>';
html += '<div class="ameta"><span class="badge">' + receiptCount + ' فیش امروز</span>';
if(isIdle) html += '<span class="badge idle">' + idle + ' ساعت راکد</span>';
else if(idle!=null) html += '<span class="badge">' + idle + ' ساعت پیش</span>';
html += '</div></div>';
}
html += '</div>';
}
const receipts = selectedAccountId ? (data.receipts||[]).filter(function(r){ return r.account_id===selectedAccountId; }) : (data.receipts||[]);
html += '<div class="section-title">فیش‌های این روز (' + receipts.length + ' مورد)' + (selectedAccountId?' <a href="#" id="clearAccountFilter" style="color:var(--gold);font-size:12px;margin-right:10px">نمایش همه حساب‌ها</a>':'') + '</div>';
if(!receipts.length){
html += '<div class="empty">فیشی برای این روز ثبت نشده است.</div>';
} else {
html += '<table><thead><tr><th>حساب</th><th>مسیر</th><th>واریزکننده</th><th>مبلغ</th><th>کد پیگیری</th><th>وضعیت</th></tr></thead><tbody>';
for(const r of receipts){
const rroute = (r.source_party_name ? esc(r.source_party_name) : '—') + ' ← ' + (r.destination_party_name ? esc(r.destination_party_name) : '—');
html += '<tr><td>' + esc(r.account_owner) + '</td><td>' + rroute + '</td><td>' + esc(r.payer_name||'—') + '</td><td>' + money(r.amount) + '</td><td>' + esc(r.tracking_code||'—') + '</td><td><span class="status ' + r.status + '">' + (r.status==='confirmed'?'تأییدشده':'برگشتی') + '</span></td></tr>';
}
html += '</tbody></table>';
}
html += '<div class="updated">آخرین به‌روزرسانی: ' + new Date().toLocaleString('fa-IR') + '</div>';
html += '<div class="updated" style="font-weight:600;color:var(--gold)">تهیه‌شده با فیش‌بان</div>';
app.innerHTML = html;
}
document.getElementById('app').addEventListener('click', function(e){
const clear = e.target.closest('#clearAccountFilter');
if(clear){ e.preventDefault(); selectedAccountId = null; if(lastData) render(lastData); return; }
const card = e.target.closest('[data-account-id]');
if(card && lastData){
const id = Number(card.getAttribute('data-account-id'));
selectedAccountId = selectedAccountId===id ? null : id;
render(lastData);
}
});
document.getElementById('btnToday').onclick = function(){
document.getElementById('btnToday').classList.add('active');
document.getElementById('btnYesterday').classList.remove('active');
load(jalaliDateFor(0));
};
document.getElementById('btnYesterday').onclick = function(){
document.getElementById('btnYesterday').classList.add('active');
document.getElementById('btnToday').classList.remove('active');
load(jalaliDateFor(-1));
};
load(jalaliDateFor(0));
</script>
</body>
